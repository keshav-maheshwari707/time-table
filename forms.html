        <h2>Drag and Drop</h2>
  <div id="drag-source" draggable="true">Drag me</div>
  <div id="drop-target">Drop here</div>

  <script>
    const dragSource = document.getElementById("drag-source");
    const dropTarget = document.getElementById("drop-target");

    dragSource.addEventListener("dragstart", function (e) {
      e.dataTransfer.setData("text/plain", "This box was dropped!");
    });

    dropTarget.addEventListener("dragover", function (e) {
      e.preventDefault(); // allow drop
    });

    dropTarget.addEventListener("drop", function (e) {
      e.preventDefault();
      const data = e.dataTransfer.getData("text/plain");
      dropTarget.textContent = data;
      dropTarget.style.backgroundColor = "#d4ffd4";
    });
  </script>
