<!DOCTYPE html>
<html>

<head>
    <title>CSS Box Model</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #eef2f5;
        }
        .box{ 
            width: 250px;
            border: 5px solid #333;
            padding: 20px;
            margin: 30px;
            background-color: white;
        }
        .box2{
            width: 250px;
            border: 3px dashed blue;
            padding: 10px;
            margin: 10px 50px;
            background-color: #e0f7ff;
        }
    </style>
    
</head>

<body>
    <h1>CSS Box Model</h1>
    <div class="box">
        <strong>Box 1</strong>
    </div>
    <div class="box2">
        <strong>Box 2</strong>
    </div>
</body>

</html>
